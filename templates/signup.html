{% extends "base.html" %}
{% block title %}Create Account — AI Job Hunter{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-64px)] flex items-center justify-center py-12 px-4 bg-gradient-to-br from-indigo-50 via-white to-purple-50">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-4">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900">Create your account</h1>
        <p class="text-gray-500 text-sm mt-1">Start finding your next opportunity today</p>
      </div>

      <!-- Error Banner -->
      {% if error %}
      <div class="mb-4 bg-red-50 border border-red-200 rounded-xl p-3 flex items-center gap-2">
        <svg class="w-4 h-4 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p class="text-sm text-red-700">{{ error }}</p>
      </div>
      {% endif %}

      <!-- Form -->
      <form id="signup-form" method="POST" action="/api/auth/signup" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
          <input type="text" name="full_name" id="full_name" required autocomplete="name"
            value="{{ form_data.full_name if form_data else '' }}"
            placeholder="Maryam Mumtaz"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm">
          <p id="name-error" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
          <input type="email" name="email" id="email" required autocomplete="email"
            value="{{ form_data.email if form_data else '' }}"
            placeholder="you@example.com"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm">
          <p id="email-error" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <input type="password" name="password" id="password" required autocomplete="new-password"
              placeholder="At least 8 characters"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm pr-10">
            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
          <!-- Password strength -->
          <div class="mt-2">
            <div class="flex gap-1 mb-1">
              <div id="str-1" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors"></div>
              <div id="str-2" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors"></div>
              <div id="str-3" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors"></div>
              <div id="str-4" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors"></div>
            </div>
            <p id="strength-label" class="text-xs text-gray-400"></p>
          </div>
          <p id="password-error" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
          <input type="password" name="confirm_password" id="confirm_password" required autocomplete="new-password"
            placeholder="Repeat your password"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm">
          <p id="confirm-error" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-md shadow-indigo-200 mt-2 flex items-center justify-center gap-2">
          <span id="submit-text">Create Account</span>
          <div id="submit-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account?
        <a href="/signin" class="text-indigo-600 font-semibold hover:underline">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
